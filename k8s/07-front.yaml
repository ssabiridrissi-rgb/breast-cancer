apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: bc-front
  name: bc-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bc-front
  template:
    metadata:
      labels:
        app: bc-front
    spec:
      containers:
      - image: bc-front:1.0
        name: bc-front
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8501
        env:
        - name: API_URL
          value: "http://bc-api:8000"
        - name: APP_TITLE
          valueFrom:
            configMapKeyRef:
              name: ml-config
              key: APP_TITLE
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secret
              key: API_KEY
        startupProbe:                # ← B1 : Streamlit est lent, jusqu'à 24 × 5 s = 120 s
          httpGet:
            path: /_stcore/health
            port: 8501
          periodSeconds: 5
          failureThreshold: 24
        livenessProbe:               # ← B1
          httpGet:
            path: /_stcore/health
            port: 8501
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:              # ← B1
          httpGet:
            path: /_stcore/health
            port: 8501
          periodSeconds: 5
          failureThreshold: 2
        resources:                   # ← B1
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: bc-front
  name: bc-front
spec:
  ports:
  - name: 80-8501
    port: 80
    protocol: TCP
    targetPort: 8501
  selector:
    app: bc-front
  type: ClusterIP