apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: bc-front
  name: bc-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bc-front
  strategy: {}
  template:
    metadata:
      labels:
        app: bc-front
    spec:
      containers:
      - image: bc-front:1.0
        name: bc-front
        imagePullPolicy: IfNotPresent        # ← image locale
        ports:
        - containerPort: 8501
        env:
        - name: API_URL                      # ← le front appelle l'API en INTERNE
          value: "http://bc-api:8000"
        - name: APP_TITLE                    # ← UNE clé lue dans le ConfigMap
          valueFrom:
            configMapKeyRef:
              name: ml-config
              key: APP_TITLE
        - name: API_KEY                      # ← le « badge » pour l'API
          valueFrom:
            secretKeyRef:
              name: api-secret
              key: API_KEY
        resources: {}
status: {}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: bc-front
  name: bc-front
spec:
  ports:
  - name: 80-8501
    port: 80                # ← port du Service (celui que l'Ingress appelle)
    protocol: TCP
    targetPort: 8501        # ← port du conteneur Streamlit
  selector:
    app: bc-front
  type: ClusterIP
status:
  loadBalancer: {}