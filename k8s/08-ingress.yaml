apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bc-ingress
  annotations:                                               # ← AJOUT
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
  - host: bc.local
    http:
      paths:
      - backend:
          service:
            name: bc-front
            port:
              number: 80
        path: /
        pathType: Prefix
      - backend:
          service:
            name: bc-api
            port:
              number: 8000
        path: /api
        pathType: Prefix
status:
  loadBalancer: {}